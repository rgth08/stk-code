name: Build STK ARMv7

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPILE_ARCH: armv7
    steps:
      - uses: actions/checkout@v4
        with:
          path: stk-code

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake meson ninja-build \
            python3 python3-pip python3-mako python3-packaging \
            flex bison autoconf automake libtool pkg-config \
            imagemagick pngquant advancecomp libjpeg-progs optipng \
            vorbis-tools subversion wget unzip

      - name: Setup Android SDK manual
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          mv bin lib NOTICE.txt source.properties latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install NDK 28.1.13356709
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "platforms;android-35" "build-tools;35.0.0"

      - name: Download STK dependencies sources
        working-directory: stk-code/lib
        run: |
          wget -q https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz
          tar -xf dependencies-android-src.tar.xz
          rm dependencies-android-src.tar.xz

      - name: Download STK assets (as sibling)
        run: |
          svn checkout https://svn.code.sf.net/p/supertuxkart/code/stk-assets stk-assets

      - name: Create symlinks
        working-directory: stk-code/android
        run: |
          ln -sf $ANDROID_HOME $PWD/android-sdk
          ln -sf $ANDROID_HOME/ndk $PWD/android-ndk

      - name: Patch build scripts (make_deps.sh + Android.mk)
        working-directory: stk-code/android
        run: |
          # make_deps.sh
          sed -i 's/-DCURL_CA_PATH=none/-DCURL_CA_PATH=none -DCURL_USE_LIBPSL=OFF/' make_deps.sh
          sed -i 's|-fpic -O3 -g" &&|-fpic -O3 -g" -DWITH_SIMD=OFF \&\&|' make_deps.sh
          mkdir -p deps-armeabi-v7a
          touch deps-armeabi-v7a/shaderc.stamp
          touch deps-armeabi-v7a/astc-encoder.stamp

          # Android.mk
          sed -i '97,99s/^/#/' Android.mk
          sed -i '111,113s/^/#/' Android.mk
          sed -i '210s/-DENABLE_LIBASTCENC/-DDISABLE_SHADERC/' Android.mk
          sed -i '205,230{
            /shaderc\/libshaderc\/include/d
            /astc-encoder\/Source/d
            /I\.\.\/lib\/libsquish/ s/ *\\$//
          }' Android.mk
          sed -i 's/LOCAL_STATIC_LIBRARIES := shaderc libsquish libastcenc/LOCAL_STATIC_LIBRARIES := libsquish/' Android.mk

          echo "=== Verificación Android.mk ==="
          grep -n "DISABLE_SHADERC" Android.mk

      - name: Patch source code (auto-accel + resolución + blur)
        working-directory: stk-code
        run: |
          python3 << 'PYEOF'
          # ============ PATCH 1: Auto-aceleración ============
          p = 'src/karts/controller/player_controller.cpp'
          with open(p) as f: c = f.read()
          anchor = '    // Only accept rescue if there is no kart animation is already playing'
          insert = '''    // AUTO-ACCELERATION FORZADA (no acelera si frenas)
    if (!m_controls->getBrake())
        m_controls->setAccel(1.0f);

'''
          if 'AUTO-ACCELERATION FORZADA' not in c and anchor in c:
              c = c.replace(anchor, insert + anchor, 1)
              with open(p, 'w') as f: f.write(c)
              print('PATCH 1 OK: auto-aceleracion aplicada')
          else:
              print('PATCH 1 SKIP')

          # ============ PATCH 2: Forzar resolución 0.3f ============
          # 2a: irr_driver.cpp
          p = 'src/graphics/irr_driver.cpp'
          with open(p) as f: c = f.read()
          old = 'GE::getGEConfig()->m_render_scale =\n                UserConfigParams::m_scale_rtts_factor;'
          new = 'GE::getGEConfig()->m_render_scale = 0.3f; // FORCED'
          if old in c:
              c = c.replace(old, new, 1)
              with open(p, 'w') as f: f.write(c)
              print('PATCH 2a OK: irr_driver.cpp')
          else:
              print('PATCH 2a SKIP')

          # 2b: post_processing.cpp
          p = 'src/graphics/post_processing.cpp'
          with open(p) as f: c = f.read()
          old = 'drawFullScreenEffect(UserConfigParams::m_scale_rtts_factor);'
          new = 'drawFullScreenEffect(0.3f); // FORCED'
          if old in c:
              c = c.replace(old, new)
              with open(p, 'w') as f: f.write(c)
              print('PATCH 2b OK: post_processing.cpp')
          else:
              print('PATCH 2b SKIP')

          # 2c: shader_based_renderer.cpp
          p = 'src/graphics/shader_based_renderer.cpp'
          with open(p) as f: c = f.read()
          old = '                    UserConfigParams::m_scale_rtts_factor : 1.0f,'
          new = '                    0.3f : 1.0f, // FORCED'
          if old in c:
              c = c.replace(old, new, 1)
              with open(p, 'w') as f: f.write(c)
              print('PATCH 2c OK: shader_based_renderer.cpp')
          else:
              print('PATCH 2c SKIP')

          # ============ PATCH 3: Blur en lugar de pixelado ============
          p = 'lib/irrlicht/source/Irrlicht/COGLES2Driver.cpp'
          with open(p) as f: c = f.read()

          # MAG_FILTER (2 ocurrencias)
          old1 = '(material.TextureLayer[i].BilinearFilter || material.TextureLayer[i].TrilinearFilter) ? GL_LINEAR : GL_NEAREST);'
          new1 = 'GL_LINEAR); // FORCED BLUR'
          n1 = c.count(old1)
          c = c.replace(old1, new1)

          # MIN_FILTER (1 bloque multilínea)
          old2 = '''material.TextureLayer[i].TrilinearFilter ? GL_LINEAR_MIPMAP_LINEAR :
                                           material.TextureLayer[i].BilinearFilter ? GL_LINEAR_MIPMAP_NEAREST :
                                           GL_NEAREST_MIPMAP_NEAREST);'''
          new2 = 'GL_LINEAR_MIPMAP_LINEAR); // FORCED BLUR'
          n2 = c.count(old2)
          c = c.replace(old2, new2)

          with open(p, 'w') as f: f.write(c)
          print(f'PATCH 3 OK: blur aplicado ({n1} MAG + {n2} MIN)')

          # ============ VERIFICACIÓN FINAL ============
          print()
          print('=== Verificacion ===')
          import subprocess
          r = subprocess.run(['grep', '-c', 'AUTO-ACCELERATION FORZADA',
                              'src/karts/controller/player_controller.cpp'],
                             capture_output=True, text=True)
          print(f'Auto-accel: {r.stdout.strip()}')
          r = subprocess.run(['grep', '-c', 'FORCED', 'src/graphics/irr_driver.cpp',
                              'src/graphics/post_processing.cpp',
                              'src/graphics/shader_based_renderer.cpp'],
                             capture_output=True, text=True)
          print(f'Resolucion forzada: {r.stdout.strip()}')
          r = subprocess.run(['grep', '-c', 'FORCED BLUR',
                              'lib/irrlicht/source/Irrlicht/COGLES2Driver.cpp'],
                             capture_output=True, text=True)
          print(f'Blur: {r.stdout.strip()}')
          PYEOF

      - name: Cache compiled dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: stk-code/android/deps-armeabi-v7a
          key: stk-deps-armv7-v13-${{ hashFiles('stk-code/lib/**') }}

      - name: Compile dependencies for ARMv7
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: stk-code/android
        run: |
          chmod +x make_deps.sh
          ./make_deps.sh -j4

      - name: Generate assets
        working-directory: stk-code/android
        run: |
          chmod +x generate_assets.sh
          ./generate_assets.sh

      - name: Build APK for ARMv7
        working-directory: stk-code/android
        run: |
          chmod +x make.sh
          ./make.sh -j4

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stk-apk-armv7
          path: '**/*.apk'

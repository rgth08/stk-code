name: Build STK ARMv7

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake meson ninja-build \
            python3 python3-pip python3-mako python3-packaging \
            flex bison autoconf automake libtool pkg-config \
            imagemagick pngquant advancecomp libjpeg-progs optipng \
            vorbis-tools subversion wget unzip

      - name: Setup Android SDK manual
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          mv bin lib NOTICE.txt source.properties latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install NDK 28.1.13356709
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "platforms;android-35" "build-tools;35.0.0"

      - name: Download STK dependencies
        run: |
          cd lib
          wget -q https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz
          tar -xf dependencies-android-src.tar.xz
          rm dependencies-android-src.tar.xz

      - name: Create symlinks
        run: |
          cd android
          ln -sf $ANDROID_HOME $PWD/android-sdk
          ln -sf $ANDROID_HOME/ndk/28.1.13356709 $PWD/android-ndk

      - name: Download STK assets
        run: |
          svn checkout https://svn.code.sf.net/p/supertuxkart/code/stk-assets stk-assets

      - name: Generate assets
        run: |
          cd android
          chmod +x generate_assets.sh
          ./generate_assets.sh

      - name: Build APK
        run: |
          cd android
          chmod +x make.sh
          ./make.sh -j4

      - name: Find APK
        run: find android -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stk-apk-armv7
          path: android/**/*.apk

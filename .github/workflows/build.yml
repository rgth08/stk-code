name: Build STK ARMv7 OpenGL ES 2.0

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK manual
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          mv bin lib NOTICE.txt source.properties latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install NDK r23b
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;23.2.8568313"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev \
            libssl-dev libpng-dev libjpeg-dev libfreetype6-dev \
            libharfbuzz-dev libvorbis-dev libopenal-dev \
            libsdl2-dev libbluetooth-dev pkg-config

      - name: Build STK for Android with make.sh
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/23.2.8568313
        run: |
          chmod +x make.sh
          ./make.sh -j4 \
            -DUSE_GLES2=1 \
            -DNO_SHADERC=ON \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/23.2.8568313/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stk-apk-gles2
          path: |
            **/*.apk
